name: Video exportieren
run-name: "🎬 ${{ inputs.song_id }} – Gesang ${{ inputs.vocals }} % [${{ inputs.request_id || 'manuell' }}]"

on:
  workflow_dispatch:
    inputs:
      song_id:
        description: "Song-ID (Ordnername unter songs/)"
        required: true
        type: string
      vocals:
        description: "Gesangslautstärke in Prozent (0–100)"
        required: true
        default: "0"
        type: string
      offset:
        description: "Lyrics verschieben in Sekunden (z. B. 0.3 oder -0.2)"
        required: false
        default: "0"
        type: string
      request_id:
        description: "(wird von der App gesetzt)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Eingaben prüfen
        env:
          SONG_ID: ${{ inputs.song_id }}
          VOCALS: ${{ inputs.vocals }}
          OFFSET: ${{ inputs.offset }}
        run: |
          [[ "$SONG_ID" =~ ^[a-z0-9-]+$ ]] || { echo "::error::Ungültige Song-ID"; exit 1; }
          [[ "$VOCALS" =~ ^[0-9]{1,3}$ ]] && [ "$VOCALS" -le 100 ] || { echo "::error::Lautstärke muss 0–100 sein"; exit 1; }
          [[ "${OFFSET:-0}" =~ ^-?[0-9]{1,2}(\.[0-9]{1,2})?$ ]] || { echo "::error::Ungültiger Versatz"; exit 1; }

      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            pipeline
            songs/${{ inputs.song_id }}

      - name: ffmpeg installieren
        timeout-minutes: 12
        run: |
          for i in 1 2 3; do
            sudo timeout 180 apt-get update -qq -o Acquire::Retries=3 && \
            sudo timeout 240 apt-get install -y -qq --no-install-recommends -o Acquire::Retries=3 ffmpeg && exit 0
            echo "Versuch $i fehlgeschlagen, neuer Versuch …"; sleep 10
          done
          exit 1

      - name: Video rendern
        env:
          SONG_ID: ${{ inputs.song_id }}
          VOCALS: ${{ inputs.vocals }}
          OFFSET: ${{ inputs.offset }}
        run: |
          mkdir -p out
          python3 pipeline/render.py "songs/$SONG_ID" --vocals "$VOCALS" --offset "${OFFSET:-0}" --out "out/${SONG_ID}-gesang-${VOCALS}.mp4"

      - name: Video veröffentlichen
        env:
          SONG_ID: ${{ inputs.song_id }}
          VOCALS: ${{ inputs.vocals }}
        run: bash pipeline/publish_video.sh "$SONG_ID" "out/${SONG_ID}-gesang-${VOCALS}.mp4"
